services:
  api:
    build:
      context: .
    container_name: gym-membership-api
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "uv run alembic upgrade head &&
      uv run uvicorn main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"

  db:
    image: postgres:17
    container_name: gym-membership-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-gym_membership}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-gym_membership}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
