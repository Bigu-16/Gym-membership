[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.17.1",
    "celery[redis]>=5.5.3",
    "email-validator>=2.3.0",
    "fastapi>=0.136.1",
    "asyncpg>=0.30.0",
    "bcrypt<5",
    "greenlet>=3.0.0",
    "passlib[bcrypt]>=1.7.4",
    "pyjwt>=2.10.1",
    "pydantic-settings>=2.11.0",
    "sqlalchemy>=2.0.41",
    "python-multipart>=0.0.20",
    "redis>=6.2.0",
    "uvicorn>=0.38.0",
    "httpx>=0.28.1",
    "aiosmtplib>=5.1.2",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
