name: Daily membership reminders

# Emails members/parents whose membership ends in 5 or 3 days (set on the server with
# EXPIRY_REMINDER_DAYS). Runs every day at 09:00 UAE time and also wakes the server.
on:
  schedule:
    - cron: "0 5 * * *" # 05:00 UTC = 09:00 Asia/Dubai
  workflow_dispatch: {}

permissions: {}

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send due reminders
        env:
          API_URL: ${{ secrets.API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Add the API_URL and CRON_SECRET repository secrets first." >&2
            exit 1
          fi
          # The free Render plan sleeps; allow time to wake up and retry.
          curl --fail-with-body --silent --show-error \
            --retry 4 --retry-delay 20 --retry-all-errors --max-time 120 \
            -X POST "$API_URL/tasks/daily-reminders" \
            -H "X-Cron-Secret: $CRON_SECRET"
