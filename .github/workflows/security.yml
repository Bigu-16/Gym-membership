name: Tests and security checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * 1" # Mondays 09:00 UAE time: catch newly published vulnerabilities

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Vulnerable packages shipped to users
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm test

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Vulnerable Python packages
        run: |
          uv export --frozen --no-dev --no-hashes --format requirements-txt > /tmp/requirements.txt
          uvx pip-audit --strict --requirement /tmp/requirements.txt
      - run: uv run pytest -q
